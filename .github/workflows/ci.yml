name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile production core and run portable regressions
        shell: pwsh
        run: ./scripts/Test.ps1
      - name: Preserve portable core for development
        uses: actions/upload-artifact@v4
        with:
          name: RainWright-portable-core
          path: artifacts/bin/Rainwright/Release/net48-core/RainWright.dll
          if-no-files-found: error
          retention-days: 7
